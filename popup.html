<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, width=device-width, user-scalable=no">
	<meta name="format-detection" content="telephone=no">
	<title>팝업창</title>
	<link href="css/default.css" rel="stylesheet" type="text/css">
	<link href="css/jquery-ui.css" rel="stylesheet" type="text/css">
	<script src="js/jquery.min.js"></script>
	<script src="js/jquery-ui.js"></script>

</head>
<body>
    <!-- 팝업창 -->
    <div class="popup nopay">
        <img src="img/txt_nopay.png" alt="납부하실 금액이 없습니다.">
        <button class="btn_popup">
            <a href="#">
                <img src="img/btn_popup.png" alt="확인">
            </a>
        </button>
    </div>
    <div class="popup check">
        <img src="img/txt_checking.png" alt="점검중">
        <button class="btn_popup">
            <a href="#">
                <img src="img/btn_popup.png" alt="확인">
            </a>
        </button>
    </div>
    <div class="popup error">
        <img src="img/txt_error.png" alt="처리오류">
        <button class="btn_popup">
            <a href="#">
                <img src="img/btn_popup.png" alt="확인">
            </a>
        </button>
    </div>
    <div class="popup processing">
        <img src="img/txt_processing.png" alt="처리중">
        <button class="btn_popup">
            <a href="#">
                <img src="img/btn_popup.png" alt="확인">
            </a>
        </button>
    </div>
</body>
</html>
